
name: Atualizar catalogo ELITE PLAY

on:
  workflow_dispatch:
    inputs:
      catalogo:
        description: 'Catalogo de produtos em JSON'
        required: true
        type: string

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Atualizar catalogo
        env:
          CATALOGO: ${{ inputs.catalogo }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          dados = json.loads(os.environ["CATALOGO"])
          if not isinstance(dados, dict) or not isinstance(dados.get("products"), list):
              raise ValueError("Catalogo JSON invalido")

          Path("elite-play-catalogo.json").write_text(
              json.dumps(dados, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Publicar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elite-play-catalogo.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar catalogo ELITE PLAY"
            git push
          fi
